[package]
name = "snip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dunce = "1"
arboard = "3"
thiserror = "2"
ts-rs = "12"

[target.'cfg(unix)'.dependencies]
# Process groups, exit observation without reaping, non-blocking pipes (gitrun.rs).
nix = { version = "0.27", default-features = false, features = ["event", "fs", "poll", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
# A Job object owns the whole process tree; process-wrap terminates the
# suspended child if job setup fails (gitrun.rs).
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
