[package]
name = "snip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dunce = "1"
similar = "2"
arboard = "3"
thiserror = "2"
ts-rs = "12"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
