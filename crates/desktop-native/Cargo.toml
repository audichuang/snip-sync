[package]
name = "snip-desktop-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snip-core = { path = "../core" }
snip-remote = { path = "../remote" }
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
dunce = "1"
regex = "1"
unicode-segmentation = "1"
# Viewer-local dates in the log (already in the workspace lock).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
snip-core = { path = "../core", features = ["test-support"] }
snip-native-e2e = { path = "../native-e2e" }
# In-process UI tests (TestAppContext, #[gpui::test]); no display needed.
gpui = { version = "=0.2.2", features = ["test-support"] }
# The seeded generator `#[gpui::test(iterations = N)]` hands the fuzz lanes
# (#230): the version gpui itself uses, so `rand::SeedableRng` in the macro's
# expansion is the one the parameter type implements.
rand = "0.9"

[lints]
workspace = true
