[package]
name = "snip-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snip-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
dunce = "1"
thiserror = "2"
# Already linked into the desktop app through gpui's HTTP client; the same
# ring provider, TLS 1.3 only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
# One self-signed device certificate per install, pinned by fingerprint.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
