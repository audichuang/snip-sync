[package]
name = "snip-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "snip"
path = "src/main.rs"

[dependencies]
snip-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = "1"
