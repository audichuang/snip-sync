name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag (e.g., v1.0.0)"
                required: true
                type: string
            prerelease:
                description: "Create as pre-release"
                required: false
                type: boolean
                default: true

# Never cancel a release mid-upload; a re-pushed tag waits for the earlier run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-') }}

jobs:
    # Release gate: the tagged commit must already have a green push ci.yml
    # run (its `CI gate` fails on any non-success job) for the tagged SHA, not
    # a pull_request merge ref. A stable release needs that run on main; a
    # pre-release (tag with a `-`, e.g. v0.4.0-beta.1) may come from develop.
    # Its run id is also where verify-native takes the desktop packages from.
    verify-ci:
        name: Verify CI is green for this commit
        runs-on: ubuntu-latest
        permissions:
            actions: read
        outputs:
            run_id: ${{ steps.ci.outputs.run_id }}
        steps:
            - name: Assert ci.yml passed for the tagged commit
              id: ci
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.sha }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if [ "$PRERELEASE" = "true" ]; then BRANCHES='["main","develop"]'; else BRANCHES='["main"]'; fi
                  export BRANCHES
                  RUN_ID=$(gh api \
                    "/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&event=push" \
                    --jq '(env.BRANCHES | fromjson) as $branches | [.workflow_runs[] | select(.conclusion == "success" and (.head_branch as $b | $branches | index($b)) and .head_sha == env.SHA)] | max_by(.id) | .id // empty')
                  if [ -z "$RUN_ID" ]; then
                      echo "::error::No green push ci.yml run on $BRANCHES for $SHA." >&2
                      echo "Push the commit to main (develop is allowed for a pre-release), wait for CI to pass, then push the tag." >&2
                      exit 1
                  fi
                  echo "ci.yml is green (push to $BRANCHES) for $SHA: run $RUN_ID."
                  echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

    # Nothing below is public until publish-release: every job only produces
    # workflow artifacts, so a failed check leaves no GitHub Release at all.
    changelog:
        name: Generate Changelog
        needs: verify-ci
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # git-cliff reads merged PRs for the changelog; a private repo
            # needs the token to be allowed to list them.
            pull-requests: read
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Generate Changelog
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: -vv --latest --strip header
              env:
                  OUTPUT: CHANGES.md
                  GITHUB_REPO: ${{ github.repository }}
            - name: Keep the changelog for publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: release-notes
                  path: CHANGES.md
                  if-no-files-found: error
                  overwrite: true

    # The native desktop app is never rebuilt here. The delivery spec requires
    # the published binaries to be exactly the ones the gates accepted, and a
    # rebuild from the same SHA is not that. So this job downloads the
    # packages from the green push-to-main ci.yml run found by verify-ci
    # (Linux from native-acceptance, macOS/Windows from
    # native-candidate-artifacts), re-checks every file against the
    # SHA256SUMS written in the job that tested it, binds the Linux binary to
    # the acceptance build receipt, and hands the files on unchanged to
    # publish-release.
    verify-native:
        name: Verify Desktop (accepted CI artifacts)
        needs: verify-ci
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REPO: ${{ github.repository }}
            RUN_ID: ${{ needs.verify-ci.outputs.run_id }}
            SHA: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v6

            - name: Tag must equal the version CI built
              shell: bash
              run: |
                  set -euo pipefail
                  # CI built from Cargo.toml at this SHA; nothing here re-stamps it.
                  CARGO=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  if [ "$CARGO" != "${RELEASE_TAG#v}" ]; then
                      echo "::error::Tag $RELEASE_TAG but Cargo.toml at $SHA is $CARGO. The desktop packages carry $CARGO; bump and commit first." >&2
                      exit 1
                  fi

            - name: Download packages and receipts from CI run
              shell: bash
              run: |
                  set -euo pipefail
                  for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
                      gh run download "$RUN_ID" -R "$REPO" -n "native-candidate-$t" -D "ci/$t"
                  done
                  # Only acceptance.json + build-receipt.json; the full evidence
                  # bundle (native-acceptance-linux) stays in CI for debugging.
                  gh run download "$RUN_ID" -R "$REPO" -n native-acceptance-receipt -D ci/acceptance

            - name: Verify hashes, versions and the Linux acceptance receipt
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="${RELEASE_TAG#v}"
                  expect() {
                      local t="$1"; shift
                      local got want
                      got=$(cd "ci/$t" && find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')
                      want=$(printf '%s\n' "$@" "SHA256SUMS-$t.txt" | sort | tr '\n' ' ')
                      [ "$got" = "$want" ] || { echo "ci/$t has [$got], want [$want]" >&2; exit 1; }
                      (cd "ci/$t" && sha256sum --check --strict "SHA256SUMS-$t.txt")
                      [ "$(grep -c . "ci/$t/SHA256SUMS-$t.txt")" -eq "$#" ] || { echo "SHA256SUMS-$t.txt does not cover exactly $*" >&2; exit 1; }
                  }
                  expect aarch64-apple-darwin snip-sync_mac_arm.dmg snip-sync_mac_arm.app.tar.gz
                  expect x86_64-apple-darwin snip-sync_mac_intel.dmg snip-sync_mac_intel.app.tar.gz
                  expect x86_64-pc-windows-msvc snip-sync-windows-setup.exe snip-sync-windows-x64.zip
                  expect x86_64-unknown-linux-gnu snip-sync-linux-x86_64.tar.gz

                  # Version and layout. A dmg cannot be mounted here; its bytes were
                  # checked on macOS in CI and are pinned by the SHA256SUMS above.
                  for t in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
                      python3 scripts/verify_artifacts.py --dir "ci/$t" --version "$VERSION" --target "$t" --require-checksums
                  done
                  python3 scripts/verify_artifacts.py --file ci/aarch64-apple-darwin/snip-sync_mac_arm.app.tar.gz --version "$VERSION" --target aarch64-apple-darwin
                  python3 scripts/verify_artifacts.py --file ci/x86_64-apple-darwin/snip-sync_mac_intel.app.tar.gz --version "$VERSION" --target x86_64-apple-darwin

                  # Linux: the packaged executable must be the one the acceptance
                  # gates ran, built from this SHA, with every gate passed.
                  jq -e '.status == "PASSED" and .gate == "all"' ci/acceptance/acceptance.json
                  jq -e --arg sha "$SHA" '.sourceSha == $sha and .buildProfile == "release" and .buildExitCode == 0' ci/acceptance/build-receipt.json
                  WANT=$(jq -r .sha256 ci/acceptance/build-receipt.json)
                  GOT=$(tar -xOzf ci/x86_64-unknown-linux-gnu/snip-sync-linux-x86_64.tar.gz "snip-sync-$VERSION/bin/snip-desktop-native" | sha256sum | cut -d ' ' -f 1)
                  [ "$GOT" = "$WANT" ] || { echo "Linux package binary $GOT is not the accepted binary $WANT" >&2; exit 1; }
                  echo "LINUX_ACCEPTED_SHA=$WANT" >> "$GITHUB_ENV"

            - name: Stage desktop assets and provenance
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release/assets
                  for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
                      find "ci/$t" -type f ! -name 'SHA256SUMS-*' -exec cp {} release/assets/ \;
                  done
                  (cd release/assets && sha256sum -- * > ../snip-sync-desktop-SHA256SUMS.txt)
                  mv release/snip-sync-desktop-SHA256SUMS.txt release/assets/

                  RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
                  {
                      echo
                      echo "## Desktop app (native)"
                      echo
                      echo "These files are byte-for-byte the packages that passed CI run [$RUN_ID]($RUN_URL) for \`$SHA\`; they were not rebuilt for the release. The Linux executable is the one the acceptance gates ran (sha256 \`$LINUX_ACCEPTED_SHA\`)."
                      echo
                      echo "The app is not notarized or code-signed with a certificate (macOS is ad-hoc signed). On macOS, if it will not open: System Settings → Privacy & Security → Open Anyway, or run \`xattr -cr /Applications/snip-sync.app\`. On Windows, SmartScreen may warn: More info → Run anyway. The Windows installer offers to remove an older Tauri-based snip-sync."
                      echo
                      echo '```'
                      cat release/assets/snip-sync-desktop-SHA256SUMS.txt
                      echo '```'
                  } > release/provenance.md

            - name: Hand the verified assets to publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-assets
                  path: release
                  if-no-files-found: error
                  overwrite: true

    build-cli:
        needs: verify-ci
        name: Build CLI (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
        steps:
            - uses: actions/checkout@v6

            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Sync Version
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="${RELEASE_TAG#v}"
                  perl -pi -e "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
                  grep -q "^version = \"$VERSION\"$" Cargo.toml

            - name: Build CLI
              run: cargo build --release -p snip-cli --target ${{ matrix.target }}

            - name: Smoke test CLI
              shell: bash
              run: |
                  set -euo pipefail
                  BIN="target/${{ matrix.target }}/release/snip"
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      BIN="${BIN}.exe"
                  fi
                  # x86_64-apple-darwin is cross-built on an arm64 runner; running
                  # it relies on Rosetta, which is not guaranteed.
                  HOST_ARCH="$(uname -m)"
                  case "${{ matrix.target }}" in
                    x86_64-apple-darwin) [ "$HOST_ARCH" = "x86_64" ] || { echo "Skipping execution of $BIN on $HOST_ARCH"; file "$BIN"; exit 0; } ;;
                  esac
                  "$BIN" --help > /dev/null
                  GOT="$("$BIN" --version)"
                  echo "$GOT"
                  # A binary that self-reports the wrong version must not ship.
                  if [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
                      [[ "$GOT" == "snip ${RELEASE_TAG#v}" ]] \
                        || { echo "version mismatch: got '$GOT', want 'snip ${RELEASE_TAG#v}'" >&2; exit 1; }
                  fi

            - name: Package CLI (Unix)
              if: runner.os != 'Windows'
              run: tar -czvf snip-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release snip

            - name: Package CLI (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: Compress-Archive -Path target/${{ matrix.target }}/release/snip.exe -DestinationPath snip-${{ matrix.target }}.zip

            - name: Hand the CLI archive to publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: cli-${{ matrix.target }}
                  path: snip-${{ matrix.target }}.*
                  if-no-files-found: error
                  overwrite: true

    # The only job that makes anything public, and only after every build and
    # verification job succeeded. The release is created as a draft with all
    # assets attached, checked, then published in one API call.
    publish-release:
        name: Publish GitHub Release
        needs: [changelog, verify-native, build-cli]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REPO: ${{ github.repository }}
            SHA: ${{ github.sha }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: release-notes
                  path: notes
            - uses: actions/download-artifact@v4
              with:
                  name: desktop-assets
                  path: desktop
            - uses: actions/download-artifact@v4
              with:
                  pattern: cli-*
                  path: cli
                  merge-multiple: true

            - name: Check the full asset set
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir final
                  cp desktop/assets/* cli/* final/
                  # Re-check the desktop bytes after the artifact hop.
                  (cd final && sha256sum --check --strict snip-sync-desktop-SHA256SUMS.txt)
                  for must in snip-sync_mac_arm.dmg snip-sync_mac_arm.app.tar.gz snip-sync_mac_intel.dmg snip-sync_mac_intel.app.tar.gz \
                      snip-sync-windows-setup.exe snip-sync-windows-x64.zip snip-sync-linux-x86_64.tar.gz snip-sync-desktop-SHA256SUMS.txt \
                      snip-aarch64-apple-darwin.tar.gz snip-x86_64-apple-darwin.tar.gz snip-x86_64-unknown-linux-gnu.tar.gz snip-x86_64-pc-windows-msvc.zip; do
                      [ -s "final/$must" ] || { echo "missing asset $must" >&2; exit 1; }
                  done
                  [ "$(find final -type f | wc -l)" -eq 12 ] || { ls final >&2; echo "unexpected extra assets" >&2; exit 1; }
                  cat notes/CHANGES.md desktop/provenance.md > body.md

            - name: Create draft, then publish
              shell: bash
              run: |
                  set -euo pipefail
                  # A published release for this tag is never touched; a draft
                  # left by an earlier failed attempt is replaced.
                  if gh api "repos/$REPO/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "::error::Release $RELEASE_TAG is already published." >&2
                      exit 1
                  fi
                  for id in $(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.RELEASE_TAG) | .id'); do
                      gh api -X DELETE "repos/$REPO/releases/$id"
                  done
                  ARGS=(--draft --title "snip-sync $RELEASE_TAG" --notes-file body.md --target "$SHA")
                  if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
                  gh release create "$RELEASE_TAG" -R "$REPO" "${ARGS[@]}" final/*
                  ID=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.RELEASE_TAG) | .id')
                  [ "$(printf '%s\n' "$ID" | grep -c .)" -eq 1 ] || { echo "expected one draft for $RELEASE_TAG, got: $ID" >&2; exit 1; }
                  N=$(gh api "repos/$REPO/releases/$ID" --jq '.assets | length')
                  [ "$N" -eq 12 ] || { echo "draft has $N assets, want 12" >&2; exit 1; }
                  gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false >/dev/null
                  echo "Published $RELEASE_TAG."

    # Stable tags only: `brew install` must keep pointing at the last stable
    # version, RC testers download the prerelease assets directly.
    publish-homebrew:
        name: Update Homebrew Tap
        needs: publish-release
        if: ${{ !contains(github.event.inputs.version || github.ref_name, '-') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Homebrew Tap
              uses: actions/checkout@v6
              with:
                  repository: audichuang/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: tap

            - name: Write Formula and Cask
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="${RELEASE_TAG#v}"
                  BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
                  # -f: a missing asset fails the job instead of hashing an error page.
                  sha() { curl -fsSL "$BASE/$1" | sha256sum | awk '{print $1}'; }
                  CLI_ARM=$(sha snip-aarch64-apple-darwin.tar.gz)
                  CLI_INTEL=$(sha snip-x86_64-apple-darwin.tar.gz)
                  CLI_LINUX=$(sha snip-x86_64-unknown-linux-gnu.tar.gz)
                  APP_ARM=$(sha snip-sync_mac_arm.dmg)
                  APP_INTEL=$(sha snip-sync_mac_intel.dmg)

                  # Formulae must live in Formula/: Homebrew ignores the tap root.
                  mkdir -p tap/Formula tap/Casks
                  cat > tap/Formula/snip-cli.rb <<INNER
                  class SnipCli < Formula
                    desc "Sync code snippets between machines through the clipboard (CLI)"
                    homepage "https://github.com/${{ github.repository }}"
                    version "${VERSION}"

                    on_macos do
                      if Hardware::CPU.arm?
                        url "${BASE}/snip-aarch64-apple-darwin.tar.gz"
                        sha256 "${CLI_ARM}"
                      else
                        url "${BASE}/snip-x86_64-apple-darwin.tar.gz"
                        sha256 "${CLI_INTEL}"
                      end
                    end

                    on_linux do
                      if Hardware::CPU.intel?
                        url "${BASE}/snip-x86_64-unknown-linux-gnu.tar.gz"
                        sha256 "${CLI_LINUX}"
                      end
                    end

                    def install
                      bin.install "snip"
                    end

                    test do
                      system "#{bin}/snip", "--version"
                    end
                  end
                  INNER

                  cat > tap/Casks/snip-sync.rb <<INNER
                  cask "snip-sync" do
                    arch arm: "arm", intel: "intel"

                    version "${VERSION}"
                    sha256 arm:   "${APP_ARM}",
                           intel: "${APP_INTEL}"

                    url "https://github.com/${{ github.repository }}/releases/download/v#{version}/snip-sync_mac_#{arch}.dmg"
                    name "snip-sync"
                    desc "Sync code snippets between machines through the clipboard (Desktop App)"
                    homepage "https://github.com/${{ github.repository }}"

                    depends_on macos: ">= :big_sur"

                    app "snip-sync.app"

                    # Ad-hoc signed only: Gatekeeper kills a quarantined copy on launch.
                    postflight do
                      system_command "/usr/bin/xattr", args: ["-cr", "#{appdir}/snip-sync.app"]
                    end

                    caveats <<~EOS
                      snip-sync is not notarized (ad-hoc signed only). If macOS refuses to open it:
                        System Settings > Privacy & Security > Open Anyway
                      or
                        xattr -cr #{appdir}/snip-sync.app
                    EOS

                    zap trash: [
                      "~/Library/Application Support/com.audichuang.snip-sync",
                      "~/Library/Preferences/com.audichuang.snip-sync.plist",
                      "~/Library/Saved Application State/com.audichuang.snip-sync.savedState"
                    ]
                  end
                  INNER

            - name: Commit and Push
              shell: bash
              run: |
                  set -euo pipefail
                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/snip-cli.rb Casks/snip-sync.rb
                  git commit -m "snip-sync ${RELEASE_TAG}" || { echo "No changes"; exit 0; }
                  git push
