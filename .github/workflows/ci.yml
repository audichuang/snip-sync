name: CI

# Strict by design: every job runs on every pull request and push (no path
# filters, so nothing is "skipped" into a green run), warnings are errors in
# Rust and rustdoc, lockfiles are enforced, and each job fails
# if it leaves the checkout dirty. `CI gate` is the single required check.

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions
    ACTIONLINT_VERSION: 1.7.12
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
    actionlint:
        name: Lint Workflows
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              run: |
                  curl -sSfL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            # shellcheck is preinstalled on ubuntu runners, so run: blocks are linted too.
            - name: Run actionlint
              run: actionlint -color

    format:
        name: Format Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Rust format
              run: cargo fmt --all -- --check

    # clippy + rustdoc on all three OSes; audit once, on Linux.
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            RUSTFLAGS: "-D warnings"
            RUSTDOCFLAGS: "-D warnings"
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  # Only main writes: its caches are readable from every branch and
                  # PR, and one set fits the repo's 10 GB quota (per-branch sets
                  # plus sccache evicted each other, leaving ~0% hits).
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  shared-key: ${{ runner.os }}-lint
                  cache-on-failure: true
            - name: Install Linux system dependencies (X11/xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
                      libfontconfig1-dev libfreetype6-dev \
                      libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      libwayland-dev fonts-dejavu-core fonts-noto-cjk
            - name: Clippy (all targets, warnings as errors, locked)
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - name: Rustdoc (broken links and doc warnings are errors)
              run: cargo doc --workspace --no-deps --locked
            # Blocks on vulnerabilities; informational warnings stay visible in the log.
            - name: Install cargo-audit
              if: runner.os == 'Linux'
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - name: Cargo audit (vulnerabilities fail the build)
              if: runner.os == 'Linux'
              run: cargo audit
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Unit, integration, contract, CLI E2E and cross-tool tests on 3 OSes.
    test:
        name: Test (${{ matrix.os }}, ${{ matrix.shard }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      shard: 1/1
                      shard_index: 1
                      last: true
                    - os: macos-latest
                      shard: 1/2
                      shard_index: 1
                    - os: macos-latest
                      shard: 2/2
                      shard_index: 2
                      last: true
                    - os: windows-latest
                      shard: 1/3
                      shard_index: 1
                    - os: windows-latest
                      shard: 2/3
                      shard_index: 2
                    - os: windows-latest
                      shard: 3/3
                      shard_index: 3
                      last: true
        env:
            RUSTFLAGS: "-D warnings"
            # A test that would skip for a missing prerequisite fails instead.
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_E2E_TIMEOUT_SCALE: "2"
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  # Only main writes: its caches are readable from every branch and
                  # PR, and one set fits the repo's 10 GB quota (per-branch sets
                  # plus sccache evicted each other, leaving ~0% hits).
                  # One writer per OS: shard 1, which builds every test binary too.
                  save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard_index == 1 }}
                  shared-key: ${{ runner.os }}-test
                  cache-on-failure: true
            - name: Install Linux system dependencies (xvfb for clipboard, X11/xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      xvfb libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
                      libfontconfig1-dev libfreetype6-dev \
                      libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      libwayland-dev fonts-dejavu-core fonts-noto-cjk
            # Tests commit into fixture repos, so git needs an identity.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            # Pinned TS reference for the cross-tool tests (plan.md section 5, layer 3).
            - name: Checkout TS reference (ClipCodeVSCode @ 0aa24c8)
              uses: actions/checkout@v6
              with:
                  repository: audichuang/ClipCodeVSCode
                  ref: 0aa24c8ea2d9c7cd7fe4a8f390110c3c7efd5fd9
                  path: .ts-ref-src
            - name: Extract TS reference
              shell: bash
              run: |
                  mkdir -p .ts-ref
                  git -C .ts-ref-src archive --format=tar --output="$RUNNER_TEMP/ts-reference.tar" HEAD src test scripts AGENTS.md
                  tar -x -f - -C .ts-ref < "$RUNNER_TEMP/ts-reference.tar"
            - name: Setup Node (cross-tool tests)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install cargo-nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest
            - name: Git runner smoke test (macOS fast gate)
              if: runner.os == 'macOS' && matrix.shard_index == 1
              timeout-minutes: 5
              run: cargo test -p snip-core --locked --test git_runner fast_child_rapid_cleanup_releases_all_permits_without_leftover_error -- --exact
            # One cargo invocation, so core, CLI and the native crate (its unit
            # and in-process #[gpui::test]s) compile in parallel. The real-app
            # drivers (snip-native-e2e) run in native-acceptance instead.
            - name: Workspace tests (Linux, under xvfb for the clipboard)
              if: runner.os == 'Linux'
              run: xvfb-run -a cargo nextest run --workspace --exclude snip-native-e2e --locked --no-fail-fast --partition hash:${{ matrix.shard }}
            - name: Workspace tests
              if: runner.os != 'Linux'
              run: cargo nextest run --workspace --exclude snip-native-e2e --locked --no-fail-fast --partition hash:${{ matrix.shard }}
            # Spread over the shards: doctests on the last, the binary on the first.
            - name: Doc tests
              if: matrix.last
              run: cargo test --doc --workspace --exclude snip-native-e2e --locked
            - name: Build native binary (debug)
              if: matrix.shard_index == 1
              run: cargo build -p snip-desktop-native --locked
            - name: Native binary CLI smoke test
              if: matrix.shard_index == 1
              shell: bash
              run: |
                  BIN="target/debug/snip-desktop-native"
                  [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION"
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Python stdlib harness contracts, workload generators, and real private X11/D-Bus
    # cleanup regressions. Uses isolated displays and temporary repositories.
    harness:
        name: Memory Harness Contracts
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install private X11/D-Bus cleanup regression tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y dbus xvfb xclip mesa-vulkan-drivers
            - name: Run harness contract tests (stdlib unittest)
              env:
                  PYTHONDONTWRITEBYTECODE: "1"
                  SNIP_REQUIRE_ALL_TESTS: "1"
              run: python3 -B -m unittest discover -s scripts/tests -v
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # The image `just preflight` runs CI's Linux jobs in on macOS (scripts/linux_container.sh).
    # Apple's container cannot run in a hosted macOS VM, so the same Dockerfile is built
    # here (x86_64; the Mac builds arm64) and the harness runs in it as it does there:
    # unprivileged, with the checkout read-only.
    # Remote-node connectivity end to end, apart from the GUI gates: a real
    # `snip worker` process and a real `snip remote` master over TLS on 127.0.0.1
    # (scripts/remote_e2e.sh). Windows matters most: it is the headless worker.
    remote-e2e:
        name: Remote E2E (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            # A check that cannot run (no symlinks) fails instead of skipping.
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_E2E_TIMEOUT_SCALE: "2"
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  # Reads the Test job's debug cache; never writes its own set.
                  save-if: false
                  shared-key: ${{ runner.os }}-test
            - name: Lint the script
              if: runner.os == 'Linux'
              run: shellcheck scripts/remote_e2e.sh
            - name: Build snip
              run: cargo build -p snip-cli --locked
            - name: Remote E2E
              shell: bash
              run: |
                  snip=target/debug/snip
                  [ -x "$snip" ] || snip=$snip.exe
                  scripts/remote_e2e.sh --snip "$snip"

    linux-container:
        name: Linux Container Image
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - name: Lint the container scripts
              run: shellcheck scripts/linux_container.sh scripts/linux-container/entrypoint.sh
            - name: Build the image
              run: docker build -t snip-preflight scripts/linux-container
            - name: Harness tests in the image
              # target/ is a volume, as on the Mac: a harness test lists the e2e tests through
              # cargo. Its mount point is made first, since the checkout is mounted read-only.
              run: |
                  mkdir -p target
                  docker run --rm --init --shm-size=2g \
                      -v "$PWD:$PWD:ro" -v snip-target:"$PWD/target" -w "$PWD" \
                      snip-preflight just preflight-harness
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Independent release-profile real-app gates. Each driver owns private
    # Xvfb, HOME and D-Bus; no shared DISPLAY or guessed historical binary.
    # Build once; the gates below run in parallel against this exact binary
    # (run_native_acceptance.py re-verifies the checkout and sha256 in each).
    native-acceptance-build:
        name: Native Acceptance Build (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            RUSTFLAGS: "-D warnings"
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_NATIVE_PYTHON: /usr/bin/python3
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  # Only main writes: its caches are readable from every branch and
                  # PR, and one set fits the repo's 10 GB quota (per-branch sets
                  # plus sccache evicted each other, leaving ~0% hits).
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  shared-key: ${{ runner.os }}-native-acceptance-release
                  cache-on-failure: true
            - name: Install native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential libxcb1-dev libx11-dev \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev
            - name: Build the release executable and its receipt
              run: '"$SNIP_NATIVE_PYTHON" -B scripts/run_native_acceptance.py --gate build --output "$RUNNER_TEMP/native-acceptance"'
            - name: Upload the accepted build
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-build
                  path: ${{ runner.temp }}/native-acceptance
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              if: always()
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # The gates, sharded so the slowest (18 collaboration cases, ~10 min in
    # one job) is split in two and smoke/lifecycle run on the release build. The build is restored at its original
    # absolute path, which the receipt records.
    native-acceptance-shard:
        name: Native Acceptance (${{ matrix.name }})
        needs: native-acceptance-build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ime-resources
                      gate: ime,resource-short
                      shard: ""
                    - name: collaboration-1
                      gate: collaboration
                      shard: 1/2
                    - name: collaboration-2
                      gate: collaboration
                      shard: 2/2
                    # crates/native-e2e: real OS input, screenshots, close/reopen/quit
                    # drain and copy/paste cancel, driving the accepted binary.
                    - name: smoke
                      gate: smoke
                      shard: ""
                      drivers: true
                    - name: lifecycle
                      gate: lifecycle
                      shard: ""
                      drivers: true
        env:
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_NATIVE_PYTHON: /usr/bin/python3
            # lavapipe renders on the CPU; shared runners miss fixed deadlines.
            SNIP_E2E_TIMEOUT_SCALE: "2"
        steps:
            - uses: actions/checkout@v6
            # Only the Rust drivers compile anything (snip-core and the tests,
            # debug); the app itself comes from native-acceptance-build.
            - name: Install Rust toolchain
              if: matrix.drivers
              uses: dtolnay/rust-toolchain@stable
            - name: Rust Cache
              if: matrix.drivers
              uses: Swatinem/rust-cache@v2
              with:
                  # Only main writes: its caches are readable from every branch and
                  # PR, and one set fits the repo's 10 GB quota (per-branch sets
                  # plus sccache evicted each other, leaving ~0% hits).
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  shared-key: ${{ runner.os }}-native-e2e
                  cache-on-failure: true
            # The drivers compile C helpers at run time (lifecycle's WM_DELETE sender,
            # the IME XCB probe), so they need the X11/XCB -dev headers, not just runtime libs.
            - name: Install isolated acceptance dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential libx11-dev libxcb1-dev libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      xvfb xdotool xclip x11-apps x11-utils imagemagick dbus-x11 \
                      fcitx5 fcitx5-pinyin python3-pil fonts-dejavu-core fonts-noto-cjk
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Restore the accepted build
              uses: actions/download-artifact@v4
              with:
                  name: native-acceptance-build
                  path: ${{ runner.temp }}/native-acceptance
            - name: Run ${{ matrix.gate }} ${{ matrix.shard }}
              shell: bash
              env:
                  GATE: ${{ matrix.gate }}
                  SHARD: ${{ matrix.shard }}
                  OUT: ${{ runner.temp }}/native-acceptance-${{ matrix.name }}
              run: |
                  set -euo pipefail
                  # upload-artifact drops the exec bit; the sha256 is unchanged.
                  chmod +x "$RUNNER_TEMP/native-acceptance/snip-desktop-native"
                  "$SNIP_NATIVE_PYTHON" -B scripts/run_native_acceptance.py --gate "$GATE" \
                      ${SHARD:+--collaboration-shard "$SHARD"} \
                      --build-receipt "$RUNNER_TEMP/native-acceptance/build-receipt.json" --output "$OUT"
            - name: Upload shard receipts, driver results and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-linux-${{ matrix.name }}
                  path: ${{ runner.temp }}/native-acceptance-${{ matrix.name }}
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              if: always()
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Folds the shards into the single gate-all receipt release.yml checks
    # (refusing any missing gate or collaboration step), then packages the
    # accepted executable itself.
    native-acceptance:
        name: Native Acceptance (Linux)
        needs: [native-acceptance-build, native-acceptance-shard]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_NATIVE_PYTHON: /usr/bin/python3
        steps:
            - uses: actions/checkout@v6
            - name: Install runtime libraries for the packaged smoke
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libxkbcommon-x11-0 libxcb1 libfontconfig1 libfreetype6
            - name: Restore the accepted build
              uses: actions/download-artifact@v4
              with:
                  name: native-acceptance-build
                  path: ${{ runner.temp }}/native-acceptance
            - name: Restore the shard results
              uses: actions/download-artifact@v4
              with:
                  pattern: native-acceptance-linux-*
                  path: ${{ runner.temp }}/shards
            - name: Merge shard receipts into the gate-all receipt
              shell: bash
              run: |
                  set -euo pipefail
                  chmod +x "$RUNNER_TEMP/native-acceptance/snip-desktop-native"
                  "$SNIP_NATIVE_PYTHON" -B scripts/run_native_acceptance.py --gate merge \
                      --build-receipt "$RUNNER_TEMP/native-acceptance/build-receipt.json" \
                      --output "$RUNNER_TEMP/native-acceptance-merged" \
                      --merge "$RUNNER_TEMP"/shards/native-acceptance-linux-*
                  # release.yml reads both receipts from one artifact root.
                  cp "$RUNNER_TEMP/native-acceptance/build-receipt.json" "$RUNNER_TEMP/native-acceptance-merged/"
            # The Linux release asset is packaged from the executable the gates
            # above ran (build-receipt.json), never from a second build: the
            # delivery spec requires published binaries to be the accepted ones
            # by hash.
            - name: Package, verify and smoke the accepted Linux executable
              shell: bash
              env:
                  ACCEPTANCE_OUT: ${{ runner.temp }}/native-acceptance-merged
                  PKG_OUT: ${{ runner.temp }}/native-candidate-x86_64-unknown-linux-gnu
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  BIN=$(jq -r .binary "$ACCEPTANCE_OUT/build-receipt.json")
                  WANT=$(jq -r .sha256 "$ACCEPTANCE_OUT/build-receipt.json")
                  jq -e '.status == "PASSED" and .gate == "all"' "$ACCEPTANCE_OUT/acceptance.json"
                  ./scripts/package_native.sh x86_64-unknown-linux-gnu "$PKG_OUT" "$BIN" "$VERSION"
                  python3 scripts/verify_artifacts.py --dir "$PKG_OUT" --version "$VERSION" --target x86_64-unknown-linux-gnu --require-checksums
                  GOT=$(tar -xOzf "$PKG_OUT/snip-sync-linux-x86_64.tar.gz" "snip-sync-$VERSION/bin/snip-desktop-native" | sha256sum | cut -d ' ' -f 1)
                  [ "$GOT" = "$WANT" ] || { echo "packaged binary $GOT is not the accepted binary $WANT" >&2; exit 1; }
                  SMOKE=$(mktemp -d)
                  tar -xzf "$PKG_OUT/snip-sync-linux-x86_64.tar.gz" -C "$SMOKE"
                  python3 scripts/smoke_native.py --bin "$SMOKE/snip-sync-$VERSION/bin/snip-desktop-native" --expected-version "$VERSION"
                  echo "accepted binary sha256 $WANT packaged for $VERSION"
            - name: Upload the merged receipt
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-linux
                  path: ${{ runner.temp }}/native-acceptance-merged
                  if-no-files-found: error
                  overwrite: true
            - name: Upload Linux release package (the accepted binary)
              uses: actions/upload-artifact@v4
              with:
                  name: native-candidate-x86_64-unknown-linux-gnu
                  path: ${{ runner.temp }}/native-candidate-x86_64-unknown-linux-gnu
                  if-no-files-found: error
                  overwrite: true
            # Just the two receipts release.yml checks, so a release does not
            # download the whole evidence bundle.
            - name: Upload acceptance receipts for release
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-receipt
                  path: |
                      ${{ runner.temp }}/native-acceptance-merged/acceptance.json
                      ${{ runner.temp }}/native-acceptance-merged/build-receipt.json
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              if: always()
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Native desktop packaging for macOS arm/intel and Windows x64. The files
    # uploaded here are the release assets: release.yml downloads them from
    # the green push run (main, or develop for a pre-release) of the tagged SHA and publishes them byte for
    # byte after checking SHA256SUMS. So every check below runs on the final
    # (signed, packaged) binary: the smoke test executes the copy inside the
    # published .dmg / the exe the installer actually installs. Linux is
    # packaged by native-acceptance from its gated executable instead.
    # The Intel leg is macos-26-intel and must execute its binary. The arm64 and
    # Windows jobs open the real window on a one-repo workspace (smoke_native.py --launch)
    # but send no input: macOS and Windows GUI input stays unverified here;
    # UI logic is covered on all three OSes by the in-process #[gpui::test]s.
    native-candidate-artifacts:
        name: Native Package (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            RUSTFLAGS: "-D warnings"
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            PKG_OUT: target/native-candidate-${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      mac_label: mac_arm
                    # macos-latest is arm64. This leg executes on the standard Intel label.
                    - os: macos-26-intel
                      target: x86_64-apple-darwin
                      mac_label: mac_intel
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      mac_label: ""
        steps:
            - uses: actions/checkout@v6
            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  # Only main writes: its caches are readable from every branch and
                  # PR, and one set fits the repo's 10 GB quota (per-branch sets
                  # plus sccache evicted each other, leaving ~0% hits).
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  shared-key: ${{ runner.os }}-candidate-${{ matrix.target }}
                  cache-on-failure: true
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build Native Desktop Binary (Release)
              run: cargo build --release -p snip-desktop-native --locked --target ${{ matrix.target }}
            - name: Package native desktop app
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  EXT=""
                  if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
                  BIN="target/${{ matrix.target }}/release/snip-desktop-native$EXT"
                  ./scripts/package_native.sh "${{ matrix.target }}" "$PKG_OUT" "$BIN" "$VERSION"
            - name: Verify packaged artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/verify_artifacts.py --dir "$PKG_OUT" --version "$VERSION" --target "${{ matrix.target }}" --require-checksums
            # Smoke the ad-hoc signed binary inside the .dmg (codesign rewrites
            # the Mach-O, so the pre-package binary is not what ships), and
            # require the .app.tar.gz to carry the same bytes.
            - name: Smoke the binary inside the published dmg (architecture-matched runner)
              if: runner.os == 'macOS'
              shell: bash
              env:
                  LABEL: ${{ matrix.mac_label }}
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  HOST_ARCH="$(uname -m)"
                  case "${{ matrix.target }}" in
                    x86_64-apple-darwin) WANT_ARCH=x86_64 ;;
                    *) WANT_ARCH=arm64 ;;
                  esac
                  if [ "$HOST_ARCH" != "$WANT_ARCH" ]; then
                      echo "${{ matrix.target }} must execute on a $WANT_ARCH runner; uname -m=$HOST_ARCH. Refusing a build that does not run." >&2
                      exit 1
                  fi
                  mnt=$(mktemp -d)
                  hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$PKG_OUT/snip-sync_$LABEL.dmg" >/dev/null
                  trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
                  BIN="$mnt/snip-sync.app/Contents/MacOS/snip-desktop-native"
                  DMG_SHA=$(shasum -a 256 "$BIN" | cut -d ' ' -f 1)
                  TAR_SHA=$(tar -xOzf "$PKG_OUT/snip-sync_$LABEL.app.tar.gz" snip-sync.app/Contents/MacOS/snip-desktop-native | shasum -a 256 | cut -d ' ' -f 1)
                  [ "$DMG_SHA" = "$TAR_SHA" ] || { echo "dmg binary $DMG_SHA != tarball binary $TAR_SHA" >&2; exit 1; }
                  # The hosted Intel VM has no Metal device, so GPUI never opens a
                  # window there; the arm64 leg carries the launch check.
                  LAUNCH=--launch
                  [ "$WANT_ARCH" = x86_64 ] && LAUNCH=
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION" $LAUNCH
                  echo "accepted binary sha256 $DMG_SHA"
            # Install with the published installer, require the installed exe
            # to be byte-identical to the built and zipped one, then smoke it.
            - name: Silent-install the published installer and smoke the installed exe
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
                  $dir = Join-Path $env:RUNNER_TEMP 'snip-sync-install'
                  $pkg = (Resolve-Path $env:PKG_OUT).Path
                  $setup = Join-Path $pkg 'snip-sync-windows-setup.exe'
                  $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -Wait -PassThru
                  if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
                  $zipDir = Join-Path $env:RUNNER_TEMP 'snip-sync-zip'
                  Expand-Archive -Path (Join-Path $pkg 'snip-sync-windows-x64.zip') -DestinationPath $zipDir
                  $installed = Join-Path $dir 'snip-desktop-native.exe'
                  $hashes = @(
                      (Get-FileHash $installed -Algorithm SHA256).Hash,
                      (Get-FileHash (Join-Path $zipDir 'snip-sync\snip-desktop-native.exe') -Algorithm SHA256).Hash,
                      (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release/snip-desktop-native.exe') -Algorithm SHA256).Hash
                  )
                  if (($hashes | Select-Object -Unique).Count -ne 1) { throw "installed/zipped/built exe differ: $hashes" }
                  # verify_artifacts pins the zip's licenses/; the installer must install the same set.
                  $installedLic = (Get-ChildItem (Join-Path $dir 'licenses') -File | ForEach-Object Name | Sort-Object) -join ','
                  $zipLic = (Get-ChildItem (Join-Path $zipDir 'snip-sync\licenses') -File | ForEach-Object Name | Sort-Object) -join ','
                  if (-not $installedLic -or $installedLic -ne $zipLic) { throw "installed licenses '$installedLic' != zipped '$zipLic'" }
                  python scripts/smoke_native.py --bin $installed --expected-version $version --launch
                  if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
                  Write-Output "accepted binary sha256 $($hashes[0])"
            - name: Upload release package artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: native-candidate-${{ matrix.target }}
                  path: ${{ env.PKG_OUT }}
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Single required check: fails unless every job above succeeded
    # (a skipped or cancelled job counts as a failure).
    gate:
        name: CI gate
        if: always()
        needs: [actionlint, format, lint-rust, test, harness, remote-e2e, linux-container, native-acceptance, native-candidate-artifacts]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Every job succeeded
              env:
                  RESULTS: ${{ toJSON(needs.*.result) }}
              run: |
                  echo "$RESULTS"
                  echo "$RESULTS" | jq -e 'all(. == "success")'
