name: CI

# Strict by design: every job runs on every pull request and push (no path
# filters, so nothing is "skipped" into a green run), warnings are errors in
# Rust, rustdoc and the frontend, lockfiles are enforced, and each job fails
# if it leaves the checkout dirty. `CI gate` is the single required check.

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions (keep BUN_VERSION in sync with release.yml)
    BUN_VERSION: 1.3.14
    ACTIONLINT_VERSION: 1.7.12
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    actionlint:
        name: Lint Workflows
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              run: |
                  curl -sSfL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            # shellcheck is preinstalled on ubuntu runners, so run: blocks are linted too.
            - name: Run actionlint
              run: actionlint -color

    format:
        name: Format Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Frontend format
              run: cd crates/desktop && bun run format:check

    # clippy + rustdoc on all three OSes; audit and DTO drift once, on Linux.
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            RUSTFLAGS: "-D warnings"
            RUSTDOCFLAGS: "-D warnings"
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-lint
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri, xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      fonts-dejavu-core fonts-noto-cjk
            - name: Clippy (all targets, warnings as errors, locked)
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - name: Rustdoc (broken links and doc warnings are errors)
              run: cargo doc --workspace --no-deps --locked
            # Blocks on vulnerabilities. The remaining informational warnings
            # (unmaintained / unsound) all come from Tauri's gtk-rs stack on
            # Linux and cannot be fixed here; they stay visible in the log.
            - name: Install cargo-audit
              if: runner.os == 'Linux'
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - name: Cargo audit (vulnerabilities fail the build)
              if: runner.os == 'Linux'
              run: cargo audit
            # The TS types in crates/desktop/src/generated must match the Rust DTOs.
            - name: Setup Bun
              if: runner.os == 'Linux'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Generated DTOs are up to date
              if: runner.os == 'Linux'
              run: |
                  cd crates/desktop
                  bun install --frozen-lockfile
                  bun run generate:dto
                  bun run format
                  git diff --exit-code -- src/generated
                  test -z "$(git status --porcelain -- src/generated)"
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Frontend: types, lint, unit tests, production build.
    lint-frontend:
        name: Frontend Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Setup Node (node:test runner)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Type check
              run: cd crates/desktop && bun run typecheck
            - name: Oxlint (warnings as errors)
              run: cd crates/desktop && bun run lint:check -- --max-warnings 0
            - name: Frontend unit tests
              run: cd crates/desktop && bun run test
            - name: Frontend build (Vite)
              run: cd crates/desktop && bun run build
            - name: Checkout left clean
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Unit, integration, contract, CLI E2E and cross-tool tests on 3 OSes.
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            RUSTFLAGS: "-D warnings"
            # A test that would skip for a missing prerequisite fails instead.
            SNIP_REQUIRE_ALL_TESTS: "1"
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-test
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri, xvfb for clipboard, xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      fonts-dejavu-core fonts-noto-cjk
            # Tests commit into fixture repos, so git needs an identity.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            # Pinned TS reference for the cross-tool tests (plan.md section 5, layer 3).
            - name: Checkout TS reference (ClipCodeVSCode @ 0aa24c8)
              uses: actions/checkout@v6
              with:
                  repository: audichuang/ClipCodeVSCode
                  ref: 0aa24c8ea2d9c7cd7fe4a8f390110c3c7efd5fd9
                  path: .ts-ref-src
            - name: Extract TS reference
              shell: bash
              run: |
                  mkdir -p .ts-ref
                  git -C .ts-ref-src archive HEAD src test scripts AGENTS.md | tar -x -C .ts-ref
            - name: Setup Node (cross-tool tests)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Git runner smoke test (macOS fast gate)
              if: runner.os == 'macOS'
              timeout-minutes: 5
              run: cargo test -p snip-core --locked --test git_runner fast_child_rapid_cleanup_releases_all_permits_without_leftover_error -- --exact
            - name: Workspace tests (Linux, under xvfb, excluding native binary crate)
              if: runner.os == 'Linux'
              run: xvfb-run -a cargo test --workspace --exclude snip-desktop-native --locked --no-fail-fast
            - name: Native binary unit tests (Linux)
              if: runner.os == 'Linux'
              run: cargo test -p snip-desktop-native --bin snip-desktop-native --locked --no-fail-fast
            - name: Workspace tests (excluding native binary crate)
              if: runner.os != 'Linux'
              run: cargo test --workspace --exclude snip-desktop-native --locked --no-fail-fast
            - name: Native binary unit tests
              if: runner.os != 'Linux'
              run: cargo test -p snip-desktop-native --bin snip-desktop-native --locked --no-fail-fast
            - name: Build native binary (debug)
              run: cargo build -p snip-desktop-native --locked
            - name: Native binary CLI smoke test
              shell: bash
              run: |
                  BIN="target/debug/snip-desktop-native"
                  [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION"
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Drives the real app (Rust backend + WebView) through tauri-driver and
    # runs every scenario in crates/desktop/e2e/scenarios.mjs. Linux uses
    # WebKitWebDriver, Windows msedgedriver; macOS WKWebView has no WebDriver
    # (plan.md section 5).
    desktop-e2e:
        name: Desktop E2E (${{ matrix.os }})
        env:
            SNIP_REQUIRE_ALL_TESTS: "1"
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # windows-2022, not windows-latest: on the windows-2025 image WebView2
                # never opens its DevTools port for msedgedriver
                # (actions/runner-images#14738).
                os: [ubuntu-24.04, windows-2022]
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-e2e
                  cache-on-failure: true
            - name: Install Linux system dependencies (Tauri, WebDriver, Xvfb)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb webkit2gtk-driver
            - name: Install tauri-driver
              run: cargo install tauri-driver --locked
            # msedgedriver must match the installed WebView2 runtime exactly.
            - name: Install msedgedriver matching WebView2
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cargo install --git https://github.com/chippers/msedgedriver-tool
                  # The tool downloads into the current directory; keep it out of the checkout.
                  $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                  Push-Location $dir
                  & "$HOME/.cargo/bin/msedgedriver-tool.exe"
                  Pop-Location
                  $dir >> $env:GITHUB_PATH
            # The replayed commits need a committer; runners have none.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Build the app with the frontend embedded (warnings are errors)
              env:
                  RUSTFLAGS: "-D warnings"
              run: cd crates/desktop && bun run tauri build --debug --no-bundle
            - name: Real-app scenarios (Linux, under Xvfb)
              if: runner.os == 'Linux'
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/e2e-shots
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  cd crates/desktop && xvfb-run -a node e2e/scenarios.mjs
            - name: Real-app scenarios
              if: runner.os != 'Linux'
              shell: bash
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/e2e-shots
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  cd crates/desktop && node e2e/scenarios.mjs
            - name: Upload screenshots and results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-e2e-${{ matrix.os }}
                  path: ${{ runner.temp }}/e2e-shots
                  if-no-files-found: error
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Python stdlib memory harness contracts and workload generator tests.
    # Safe tests running with isolated temporary repositories; produces no committed files.
    harness:
        name: Memory Harness Contracts
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Run harness contract tests (stdlib unittest)
              env:
                  PYTHONDONTWRITEBYTECODE: "1"
                  SNIP_REQUIRE_ALL_TESTS: "1"
              run: python3 -B -m unittest discover -s scripts/tests -v
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Native real OS input E2E test on Linux X11 (headless with Xvfb and xdotool).
    # Tests crates/desktop-native/tests/smoke.rs with real input events, screenshots,
    # and software graphics fallback (Mesa/Gallium llvmpipe). Runs in isolation
    # to avoid display or system clipboard contention with other test suites.
    native-smoke:
        name: Native Smoke (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            RUSTFLAGS: "-D warnings"
            SNIP_REQUIRE_ALL_TESTS: "1"
            LIBGL_ALWAYS_SOFTWARE: "1"
            GALLIUM_DRIVER: llvmpipe
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-native-smoke
                  cache-on-failure: true
            - name: Install Linux system dependencies (X11, Xvfb, xdotool, x11-apps, imagemagick, xkbcommon, fonts, software GL/Vulkan, Wayland)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libxkbcommon-dev libxkbcommon-x11-dev \
                      xvfb xdotool x11-apps imagemagick \
                      fonts-dejavu-core fonts-noto-cjk \
                      libfontconfig1-dev libfreetype6-dev \
                      libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      libwayland-dev
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Run native OS input smoke test (Linux X11 under Xvfb with lavapipe)
              shell: bash
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/native-e2e-artifacts
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  rm -f "$SNIP_E2E_OUT/graph.png" "$SNIP_E2E_OUT/file_tree.png" "$SNIP_E2E_OUT/paste_preview.png"
                  set -o pipefail
                  ./scripts/headless-x11.sh cargo test -p snip-desktop-native --test smoke --locked -- --nocapture 2>&1 | tee "$SNIP_E2E_OUT/smoke.log"
                  test -s "$SNIP_E2E_OUT/smoke.log" || { echo "Missing or empty smoke.log" >&2; exit 1; }
                  python3 -c "import sys, pathlib; out = pathlib.Path(sys.argv[1]); [sys.exit(f'Missing or invalid {name}') for name in ('graph.png', 'file_tree.png', 'paste_preview.png') if not (p := out / name).is_file() or p.stat().st_size == 0 or p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n']" "$SNIP_E2E_OUT"
            - name: Upload native smoke screenshots and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-smoke-linux
                  path: ${{ runner.temp }}/native-e2e-artifacts
                  if-no-files-found: error
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Native candidate release packaging across 4 targets.
    # Produces candidate packages (macOS arm/intel, Linux x64, Windows x64)
    # verified with verify_artifacts.py and uploaded as CI artifacts only.
    # The Intel leg is macos-26-intel and must run smoke_native.py. A header
    # check is not execution. These jobs do not drive the GPUI UI, so macOS
    # and Windows GUI input stays unverified.
    # No release publishing occurs until P5 is accepted by the supervisor.
    native-candidate-artifacts:
        name: Native Candidate (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            RUSTFLAGS: "-D warnings"
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
            MACOSX_DEPLOYMENT_TARGET: "11.0"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      arch: aarch64
                      exe_ext: ""
                    # macos-latest is arm64. This leg executes on the standard Intel label.
                    - os: macos-26-intel
                      target: x86_64-apple-darwin
                      arch: x86_64
                      exe_ext: ""
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      arch: x86_64
                      exe_ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      arch: x86_64
                      exe_ext: ".exe"
        steps:
            - uses: actions/checkout@v6
            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0
            - name: Install Linux system dependencies (xkbcommon, fonts, Wayland, Mesa, Vulkan)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libxkbcommon-dev libxkbcommon-x11-dev \
                      libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      fonts-dejavu-core fonts-noto-cjk
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-candidate-${{ matrix.target }}
                  cache-on-failure: true
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build Native Desktop Binary (Release)
              run: cargo build --release -p snip-desktop-native --locked --target ${{ matrix.target }}
            - name: Native CLI smoke test (architecture-matched runner)
              shell: bash
              run: |
                  set -euo pipefail
                  BIN="target/${{ matrix.target }}/release/snip-desktop-native${{ matrix.exe_ext }}"
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  HOST_ARCH="$(uname -m)"
                  case "${{ matrix.target }}" in
                    x86_64-apple-darwin)
                      if [ "$HOST_ARCH" != "x86_64" ]; then
                        echo "x86_64-apple-darwin must execute on an Intel macOS runner; uname -m=$HOST_ARCH. Refusing a cross-build that does not run." >&2
                        exit 1
                      fi
                      ;;
                  esac
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION"
            - name: Package native candidate bundle
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  BIN="target/${{ matrix.target }}/release/snip-desktop-native${{ matrix.exe_ext }}"
                  ./scripts/package_native.sh "${{ matrix.target }}" "target/native-candidate-${{ matrix.target }}" "$BIN" "$VERSION"
            - name: Verify candidate artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/verify_artifacts.py --dir "target/native-candidate-${{ matrix.target }}" --version "$VERSION" --target "${{ matrix.target }}" --require-checksums
            - name: Upload candidate package artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: native-candidate-${{ matrix.target }}
                  path: target/native-candidate-${{ matrix.target }}
                  if-no-files-found: error
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Single required check: fails unless every job above succeeded
    # (a skipped or cancelled job counts as a failure).
    gate:
        name: CI gate
        if: always()
        needs: [actionlint, format, lint-rust, lint-frontend, test, desktop-e2e, harness, native-smoke, native-candidate-artifacts]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Every job succeeded
              env:
                  RESULTS: ${{ toJSON(needs.*.result) }}
              run: |
                  echo "$RESULTS"
                  echo "$RESULTS" | jq -e 'all(. == "success")'
