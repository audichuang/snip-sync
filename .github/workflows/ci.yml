name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions (keep BUN_VERSION in sync with release.yml)
    BUN_VERSION: 1.3.14
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    # Path filter: skip unrelated jobs on pull requests
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            rust: ${{ steps.filter.outputs.rust }}
            desktop: ${{ steps.filter.outputs.desktop }}
            workflows: ${{ steps.filter.outputs.workflows }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      rust:
                          - 'crates/**'
                          - 'fixtures/**'
                          - 'Cargo.toml'
                          - 'Cargo.lock'
                          - 'rustfmt.toml'
                      desktop:
                          - 'crates/desktop/**'
                      workflows:
                          - '.github/workflows/**'

    actionlint:
        name: Lint Workflows
        needs: changes
        if: needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              shell: bash
              run: |
                  set -e
                  ACTIONLINT_VERSION="1.7.12"
                  curl -sSL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            - name: Run actionlint
              shell: bash
              run: actionlint -color

    format:
        name: Format Check
        needs: changes
        if: |
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Frontend format
              run: cd crates/desktop && bun run format:check

    # Rust lint (clippy + audit) - 3 OS matrix
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Install cargo-audit
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-lint
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - name: Cargo audit (advisories; non-blocking until tree is clean)
              continue-on-error: true
              run: cargo audit
            - name: Cargo clippy (warnings as errors, all targets)
              run: cargo clippy --workspace --all-targets -- -D warnings

    # Frontend lint + unit tests + production build
    lint-frontend:
        name: Frontend Lint
        needs: changes
        # Always on push to main: release.yml's verify-ci trusts a green push
        # run, and a skipped job still leaves the run `success`.
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Setup Node (node:test runner)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Type check
              run: cd crates/desktop && bun run typecheck
            - name: Oxlint check (warnings as errors)
              run: cd crates/desktop && bun run lint:check -- --max-warnings 0
            - name: Frontend unit tests
              run: cd crates/desktop && bun run test
            - name: Frontend build (Vite)
              run: cd crates/desktop && bun run build

    # Unit + integration tests - 3 OS matrix
    test:
        name: Test (${{ matrix.os }})
        needs: changes
        # Always on push to main, for the same verify-ci reason as lint-frontend.
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-test
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri, xvfb for the clipboard)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
            # Tests commit into fixture repos, so git needs an identity.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            # Pinned TS reference for the cross-tool tests (plan.md section 5,
            # layer 3); without it those tests skip instead of running.
            - name: Checkout TS reference (ClipCodeVSCode @ 0aa24c8)
              uses: actions/checkout@v6
              with:
                  repository: audichuang/ClipCodeVSCode
                  ref: 0aa24c8ea2d9c7cd7fe4a8f390110c3c7efd5fd9
                  path: .ts-ref-src
            - name: Extract TS reference
              shell: bash
              run: |
                  mkdir -p .ts-ref
                  git -C .ts-ref-src archive HEAD src test scripts AGENTS.md | tar -x -C .ts-ref
            - name: Setup Node (cross-tool tests)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Unit + integration tests (Linux, under xvfb)
              if: runner.os == 'Linux'
              run: xvfb-run -a cargo test --workspace --no-fail-fast
            - name: Unit + integration tests
              if: runner.os != 'Linux'
              run: cargo test --workspace --no-fail-fast
