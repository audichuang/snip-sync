name: CI

# Strict by design: every job runs on every pull request and push (no path
# filters, so nothing is "skipped" into a green run), warnings are errors in
# Rust, rustdoc and the frontend, lockfiles are enforced, and each job fails
# if it leaves the checkout dirty. `CI gate` is the single required check.

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions (keep BUN_VERSION in sync with release.yml)
    BUN_VERSION: 1.3.14
    ACTIONLINT_VERSION: 1.7.12
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    actionlint:
        name: Lint Workflows
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              run: |
                  curl -sSfL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            # shellcheck is preinstalled on ubuntu runners, so run: blocks are linted too.
            - name: Run actionlint
              run: actionlint -color

    format:
        name: Format Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Frontend format
              run: cd crates/desktop && bun run format:check

    # clippy + rustdoc on all three OSes; audit and DTO drift once, on Linux.
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            RUSTFLAGS: "-D warnings"
            RUSTDOCFLAGS: "-D warnings"
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-lint
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri, xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      fonts-dejavu-core fonts-noto-cjk
            - name: Clippy (all targets, warnings as errors, locked)
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - name: Rustdoc (broken links and doc warnings are errors)
              run: cargo doc --workspace --no-deps --locked
            # Blocks on vulnerabilities. The remaining informational warnings
            # (unmaintained / unsound) all come from Tauri's gtk-rs stack on
            # Linux and cannot be fixed here; they stay visible in the log.
            - name: Install cargo-audit
              if: runner.os == 'Linux'
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - name: Cargo audit (vulnerabilities fail the build)
              if: runner.os == 'Linux'
              run: cargo audit
            # The TS types in crates/desktop/src/generated must match the Rust DTOs.
            - name: Setup Bun
              if: runner.os == 'Linux'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Generated DTOs are up to date
              if: runner.os == 'Linux'
              run: |
                  cd crates/desktop
                  bun install --frozen-lockfile
                  bun run generate:dto
                  bun run format
                  git diff --exit-code -- src/generated
                  test -z "$(git status --porcelain -- src/generated)"
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Frontend: types, lint, unit tests, production build.
    lint-frontend:
        name: Frontend Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Setup Node (node:test runner)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Type check
              run: cd crates/desktop && bun run typecheck
            - name: Oxlint (warnings as errors)
              run: cd crates/desktop && bun run lint:check -- --max-warnings 0
            - name: Frontend unit tests
              run: cd crates/desktop && bun run test
            - name: Frontend build (Vite)
              run: cd crates/desktop && bun run build
            - name: Checkout left clean
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Unit, integration, contract, CLI E2E and cross-tool tests on 3 OSes.
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        env:
            RUSTFLAGS: "-D warnings"
            # A test that would skip for a missing prerequisite fails instead.
            SNIP_REQUIRE_ALL_TESTS: "1"
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-test
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri, xvfb for clipboard, xkbcommon/fonts/Wayland/Vulkan for native)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      fonts-dejavu-core fonts-noto-cjk
            # Tests commit into fixture repos, so git needs an identity.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            # Pinned TS reference for the cross-tool tests (plan.md section 5, layer 3).
            - name: Checkout TS reference (ClipCodeVSCode @ 0aa24c8)
              uses: actions/checkout@v6
              with:
                  repository: audichuang/ClipCodeVSCode
                  ref: 0aa24c8ea2d9c7cd7fe4a8f390110c3c7efd5fd9
                  path: .ts-ref-src
            - name: Extract TS reference
              shell: bash
              run: |
                  mkdir -p .ts-ref
                  git -C .ts-ref-src archive --format=tar --output="$RUNNER_TEMP/ts-reference.tar" HEAD src test scripts AGENTS.md
                  tar -x -f - -C .ts-ref < "$RUNNER_TEMP/ts-reference.tar"
            - name: Setup Node (cross-tool tests)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Git runner smoke test (macOS fast gate)
              if: runner.os == 'macOS'
              timeout-minutes: 5
              run: cargo test -p snip-core --locked --test git_runner fast_child_rapid_cleanup_releases_all_permits_without_leftover_error -- --exact
            - name: Workspace tests (Linux, under xvfb, excluding native binary crate)
              if: runner.os == 'Linux'
              run: xvfb-run -a cargo test --workspace --exclude snip-desktop-native --locked --no-fail-fast
            - name: Native binary unit tests (Linux)
              if: runner.os == 'Linux'
              run: cargo test -p snip-desktop-native --bin snip-desktop-native --locked --no-fail-fast
            - name: Workspace tests (excluding native binary crate)
              if: runner.os != 'Linux'
              run: cargo test --workspace --exclude snip-desktop-native --locked --no-fail-fast
            - name: Native binary unit tests
              if: runner.os != 'Linux'
              run: cargo test -p snip-desktop-native --bin snip-desktop-native --locked --no-fail-fast
            - name: Build native binary (debug)
              run: cargo build -p snip-desktop-native --locked
            - name: Native binary CLI smoke test
              shell: bash
              run: |
                  BIN="target/debug/snip-desktop-native"
                  [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION"
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Drives the real app (Rust backend + WebView) through tauri-driver and
    # runs every scenario in crates/desktop/e2e/scenarios.mjs. Linux uses
    # WebKitWebDriver, Windows msedgedriver; macOS WKWebView has no WebDriver
    # (plan.md section 5).
    desktop-e2e:
        name: Desktop E2E (${{ matrix.os }})
        env:
            SNIP_REQUIRE_ALL_TESTS: "1"
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # windows-2022, not windows-latest: on the windows-2025 image WebView2
                # never opens its DevTools port for msedgedriver
                # (actions/runner-images#14738).
                os: [ubuntu-24.04, windows-2022]
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-e2e
                  cache-on-failure: true
            - name: Install Linux system dependencies (Tauri, WebDriver, Xvfb)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb webkit2gtk-driver
            - name: Install tauri-driver
              run: cargo install tauri-driver --locked
            # msedgedriver must match the installed WebView2 runtime exactly.
            - name: Install msedgedriver matching WebView2
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cargo install --git https://github.com/chippers/msedgedriver-tool
                  # The tool downloads into the current directory; keep it out of the checkout.
                  $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                  Push-Location $dir
                  & "$HOME/.cargo/bin/msedgedriver-tool.exe"
                  Pop-Location
                  $dir >> $env:GITHUB_PATH
            # The replayed commits need a committer; runners have none.
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Build the app with the frontend embedded (warnings are errors)
              env:
                  RUSTFLAGS: "-D warnings"
              run: cd crates/desktop && bun run tauri build --debug --no-bundle
            - name: Real-app scenarios (Linux, under Xvfb)
              if: runner.os == 'Linux'
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/e2e-shots
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  cd crates/desktop && xvfb-run -a node e2e/scenarios.mjs
            - name: Real-app scenarios
              if: runner.os != 'Linux'
              shell: bash
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/e2e-shots
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  cd crates/desktop && node e2e/scenarios.mjs
            - name: Upload screenshots and results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-e2e-${{ matrix.os }}
                  path: ${{ runner.temp }}/e2e-shots
                  if-no-files-found: error
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Python stdlib harness contracts, workload generators, and real private X11/D-Bus
    # cleanup regressions. Uses isolated displays and temporary repositories.
    harness:
        name: Memory Harness Contracts
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install private X11/D-Bus cleanup regression tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y dbus xvfb xclip mesa-vulkan-drivers
            - name: Run harness contract tests (stdlib unittest)
              env:
                  PYTHONDONTWRITEBYTECODE: "1"
                  SNIP_REQUIRE_ALL_TESTS: "1"
              run: python3 -B -m unittest discover -s scripts/tests -v
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Native real OS input E2E test on Linux X11 (headless with Xvfb and xdotool).
    # Tests crates/desktop-native/tests/smoke.rs and tests/lifecycle.rs with real
    # input events, screenshots, and software graphics fallback (Mesa/Gallium
    # llvmpipe). Runs in isolation to avoid display or system clipboard
    # contention with other test suites.
    native-smoke:
        name: Native Smoke (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            RUSTFLAGS: "-D warnings"
            SNIP_REQUIRE_ALL_TESTS: "1"
            LIBGL_ALWAYS_SOFTWARE: "1"
            GALLIUM_DRIVER: llvmpipe
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-native-smoke
                  cache-on-failure: true
            - name: Install Linux system dependencies (X11, Xvfb, xdotool, xclip, x11-apps, imagemagick, xkbcommon, fonts, software GL/Vulkan, Wayland)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
                      xvfb xdotool xclip x11-apps imagemagick \
                      fonts-dejavu-core fonts-noto-cjk \
                      libfontconfig1-dev libfreetype6-dev \
                      libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      libwayland-dev
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Run native OS input smoke test (Linux X11 under Xvfb with lavapipe)
              shell: bash
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/native-e2e-artifacts
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  rm -f "$SNIP_E2E_OUT/graph.png" "$SNIP_E2E_OUT/file_tree.png" "$SNIP_E2E_OUT/paste_preview.png" "$SNIP_E2E_OUT/light_theme.png"
                  set -o pipefail
                  ./scripts/headless-x11.sh cargo test -p snip-desktop-native --test smoke --locked -- --nocapture 2>&1 | tee "$SNIP_E2E_OUT/smoke.log"
                  test -s "$SNIP_E2E_OUT/smoke.log" || { echo "Missing or empty smoke.log" >&2; exit 1; }
                  python3 -c "import sys, pathlib; out = pathlib.Path(sys.argv[1]); [sys.exit(f'Missing or invalid {name}') for name in ('graph.png', 'file_tree.png', 'paste_preview.png', 'light_theme.png') if not (p := out / name).is_file() or p.stat().st_size == 0 or p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n']" "$SNIP_E2E_OUT"
            - name: Run native lifecycle tests (close/reopen/quit drain, copy and paste cancel)
              shell: bash
              env:
                  SNIP_E2E_OUT: ${{ runner.temp }}/native-e2e-artifacts
              run: |
                  mkdir -p "$SNIP_E2E_OUT"
                  set -o pipefail
                  ./scripts/headless-x11.sh cargo test -p snip-desktop-native --test lifecycle --locked -- --nocapture 2>&1 | tee "$SNIP_E2E_OUT/lifecycle.log"
                  test -s "$SNIP_E2E_OUT/lifecycle.log" || { echo "Missing or empty lifecycle.log" >&2; exit 1; }
            - name: Upload native smoke screenshots and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-smoke-linux
                  path: ${{ runner.temp }}/native-e2e-artifacts
                  if-no-files-found: error
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Independent release-profile real-app gates. Each driver owns private
    # Xvfb, HOME and D-Bus; no shared DISPLAY or guessed historical binary.
    native-acceptance:
        name: Native Acceptance (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            RUSTFLAGS: "-D warnings"
            SNIP_REQUIRE_ALL_TESTS: "1"
            SNIP_NATIVE_PYTHON: /usr/bin/python3
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-native-acceptance-release
                  cache-on-failure: true
            - name: Install native build and isolated acceptance dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential libxcb1-dev libx11-dev \
                      libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
                      libwayland-dev libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers \
                      xvfb xdotool xclip x11-apps x11-utils imagemagick dbus-x11 \
                      fcitx5 fcitx5-pinyin python3-pil fonts-dejavu-core fonts-noto-cjk
            - name: Configure git identity
              run: |
                  git config --global user.name "snip-ci"
                  git config --global user.email "snip-ci@example.invalid"
            - name: Build once and run IME, all collaboration cases, and functional short resource gate
              env:
                  ACCEPTANCE_OUT: ${{ runner.temp }}/native-acceptance
              run: |
                  "$SNIP_NATIVE_PYTHON" -B scripts/run_native_acceptance.py --gate all --output "$ACCEPTANCE_OUT"
            # The Linux release asset is packaged from the executable the gates
            # above ran (build-receipt.json), never from a second build: the
            # delivery spec requires published binaries to be the accepted ones
            # by hash.
            - name: Package, verify and smoke the accepted Linux executable
              shell: bash
              env:
                  ACCEPTANCE_OUT: ${{ runner.temp }}/native-acceptance
                  PKG_OUT: ${{ runner.temp }}/native-candidate-x86_64-unknown-linux-gnu
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  BIN=$(jq -r .binary "$ACCEPTANCE_OUT/build-receipt.json")
                  WANT=$(jq -r .sha256 "$ACCEPTANCE_OUT/build-receipt.json")
                  jq -e '.status == "PASSED" and .gate == "all"' "$ACCEPTANCE_OUT/acceptance.json"
                  ./scripts/package_native.sh x86_64-unknown-linux-gnu "$PKG_OUT" "$BIN" "$VERSION"
                  python3 scripts/verify_artifacts.py --dir "$PKG_OUT" --version "$VERSION" --target x86_64-unknown-linux-gnu --require-checksums
                  GOT=$(tar -xOzf "$PKG_OUT/snip-sync-linux-x86_64.tar.gz" "snip-sync-$VERSION/bin/snip-desktop-native" | sha256sum | cut -d ' ' -f 1)
                  [ "$GOT" = "$WANT" ] || { echo "packaged binary $GOT is not the accepted binary $WANT" >&2; exit 1; }
                  SMOKE=$(mktemp -d)
                  tar -xzf "$PKG_OUT/snip-sync-linux-x86_64.tar.gz" -C "$SMOKE"
                  python3 scripts/smoke_native.py --bin "$SMOKE/snip-sync-$VERSION/bin/snip-desktop-native" --expected-version "$VERSION"
                  echo "accepted binary sha256 $WANT packaged for $VERSION"
            - name: Upload acceptance receipts, driver results and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-linux
                  path: ${{ runner.temp }}/native-acceptance
                  if-no-files-found: error
                  overwrite: true
            - name: Upload Linux release package (the accepted binary)
              uses: actions/upload-artifact@v4
              with:
                  name: native-candidate-x86_64-unknown-linux-gnu
                  path: ${{ runner.temp }}/native-candidate-x86_64-unknown-linux-gnu
                  if-no-files-found: error
                  overwrite: true
            # Just the two receipts release.yml checks, so a release does not
            # download the whole evidence bundle above.
            - name: Upload acceptance receipts for release
              uses: actions/upload-artifact@v4
              with:
                  name: native-acceptance-receipt
                  path: |
                      ${{ runner.temp }}/native-acceptance/acceptance.json
                      ${{ runner.temp }}/native-acceptance/build-receipt.json
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              if: always()
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Native desktop packaging for macOS arm/intel and Windows x64. The files
    # uploaded here are the release assets: release.yml downloads them from
    # the green push-to-main run of the tagged SHA and publishes them byte for
    # byte after checking SHA256SUMS. So every check below runs on the final
    # (signed, packaged) binary: the smoke test executes the copy inside the
    # published .dmg / the exe the installer actually installs. Linux is
    # packaged by native-acceptance from its gated executable instead.
    # The Intel leg is macos-26-intel and must execute its binary. These jobs
    # do not drive the GPUI UI, so macOS and Windows GUI input stays unverified.
    native-candidate-artifacts:
        name: Native Package (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            RUSTFLAGS: "-D warnings"
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            PKG_OUT: target/native-candidate-${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      mac_label: mac_arm
                    # macos-latest is arm64. This leg executes on the standard Intel label.
                    - os: macos-26-intel
                      target: x86_64-apple-darwin
                      mac_label: mac_intel
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      mac_label: ""
        steps:
            - uses: actions/checkout@v6
            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-candidate-${{ matrix.target }}
                  cache-on-failure: true
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build Native Desktop Binary (Release)
              run: cargo build --release -p snip-desktop-native --locked --target ${{ matrix.target }}
            - name: Package native desktop app
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  EXT=""
                  if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
                  BIN="target/${{ matrix.target }}/release/snip-desktop-native$EXT"
                  ./scripts/package_native.sh "${{ matrix.target }}" "$PKG_OUT" "$BIN" "$VERSION"
            - name: Verify packaged artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  python3 scripts/verify_artifacts.py --dir "$PKG_OUT" --version "$VERSION" --target "${{ matrix.target }}" --require-checksums
            # Smoke the ad-hoc signed binary inside the .dmg (codesign rewrites
            # the Mach-O, so the pre-package binary is not what ships), and
            # require the .app.tar.gz to carry the same bytes.
            - name: Smoke the binary inside the published dmg (architecture-matched runner)
              if: runner.os == 'macOS'
              shell: bash
              env:
                  LABEL: ${{ matrix.mac_label }}
              run: |
                  set -euo pipefail
                  VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
                  HOST_ARCH="$(uname -m)"
                  case "${{ matrix.target }}" in
                    x86_64-apple-darwin) WANT_ARCH=x86_64 ;;
                    *) WANT_ARCH=arm64 ;;
                  esac
                  if [ "$HOST_ARCH" != "$WANT_ARCH" ]; then
                      echo "${{ matrix.target }} must execute on a $WANT_ARCH runner; uname -m=$HOST_ARCH. Refusing a build that does not run." >&2
                      exit 1
                  fi
                  mnt=$(mktemp -d)
                  hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$PKG_OUT/snip-sync_$LABEL.dmg" >/dev/null
                  trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
                  BIN="$mnt/snip-sync.app/Contents/MacOS/snip-desktop-native"
                  DMG_SHA=$(shasum -a 256 "$BIN" | cut -d ' ' -f 1)
                  TAR_SHA=$(tar -xOzf "$PKG_OUT/snip-sync_$LABEL.app.tar.gz" snip-sync.app/Contents/MacOS/snip-desktop-native | shasum -a 256 | cut -d ' ' -f 1)
                  [ "$DMG_SHA" = "$TAR_SHA" ] || { echo "dmg binary $DMG_SHA != tarball binary $TAR_SHA" >&2; exit 1; }
                  python3 scripts/smoke_native.py --bin "$BIN" --expected-version "$VERSION"
                  echo "accepted binary sha256 $DMG_SHA"
            # Install with the published installer, require the installed exe
            # to be byte-identical to the built and zipped one, then smoke it.
            - name: Silent-install the published installer and smoke the installed exe
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
                  $dir = Join-Path $env:RUNNER_TEMP 'snip-sync-install'
                  $pkg = (Resolve-Path $env:PKG_OUT).Path
                  $setup = Join-Path $pkg 'snip-sync-windows-setup.exe'
                  $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -Wait -PassThru
                  if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
                  $zipDir = Join-Path $env:RUNNER_TEMP 'snip-sync-zip'
                  Expand-Archive -Path (Join-Path $pkg 'snip-sync-windows-x64.zip') -DestinationPath $zipDir
                  $installed = Join-Path $dir 'snip-desktop-native.exe'
                  $hashes = @(
                      (Get-FileHash $installed -Algorithm SHA256).Hash,
                      (Get-FileHash (Join-Path $zipDir 'snip-sync\snip-desktop-native.exe') -Algorithm SHA256).Hash,
                      (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release/snip-desktop-native.exe') -Algorithm SHA256).Hash
                  )
                  if (($hashes | Select-Object -Unique).Count -ne 1) { throw "installed/zipped/built exe differ: $hashes" }
                  # verify_artifacts pins the zip's licenses/; the installer must install the same set.
                  $installedLic = (Get-ChildItem (Join-Path $dir 'licenses') -File | ForEach-Object Name | Sort-Object) -join ','
                  $zipLic = (Get-ChildItem (Join-Path $zipDir 'snip-sync\licenses') -File | ForEach-Object Name | Sort-Object) -join ','
                  if (-not $installedLic -or $installedLic -ne $zipLic) { throw "installed licenses '$installedLic' != zipped '$zipLic'" }
                  python scripts/smoke_native.py --bin $installed --expected-version $version
                  if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
                  Write-Output "accepted binary sha256 $($hashes[0])"
            - name: Upload release package artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: native-candidate-${{ matrix.target }}
                  path: ${{ env.PKG_OUT }}
                  if-no-files-found: error
                  overwrite: true
            - name: Checkout left clean
              shell: bash
              run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

    # Single required check: fails unless every job above succeeded
    # (a skipped or cancelled job counts as a failure).
    gate:
        name: CI gate
        if: always()
        needs: [actionlint, format, lint-rust, lint-frontend, test, desktop-e2e, harness, native-smoke, native-acceptance, native-candidate-artifacts]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Every job succeeded
              env:
                  RESULTS: ${{ toJSON(needs.*.result) }}
              run: |
                  echo "$RESULTS"
                  echo "$RESULTS" | jq -e 'all(. == "success")'
