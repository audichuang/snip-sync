# Every test fixture repo (`git init` in desktop, core, remote, cli, native-e2e)
# runs without git's automatic maintenance. `git commit` starts
# `git maintenance run --auto --detach`, which under load packed a fixture's
# loose objects behind a test (one that deletes a loose object found none).
# One process-wide setting reaches every helper, including ones added later.
# It reaches whatever cargo starts, `cargo run` and the Rust acceptance
# driver with their children included; the app's own git calls that run
# under a boundary drop GIT_CONFIG_COUNT (`gitsrc.rs`), and turning off
# automatic maintenance changes nothing a paste or copy reads. Scripts that
# run a built binary (remote_e2e.sh, the Python fixture builders) do not
# inherit it. `crates/core/tests/fixture_git_env.rs` fails if it stops
# reaching tests.
[env]
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "gc.auto"
GIT_CONFIG_VALUE_0 = "0"
GIT_CONFIG_KEY_1 = "maintenance.auto"
GIT_CONFIG_VALUE_1 = "false"
