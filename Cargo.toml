[workspace]
members = ["crates/core", "crates/cli", "crates/desktop-native"]
resolver = "2"
# Vendored GPUI with a local patch; see vendor/gpui/SNIP_PATCH.md.
exclude = ["vendor"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
